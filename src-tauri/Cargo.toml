[package]
name = "narezki"
version = "0.1.0"
description = "Narezki — AI Vertical Video Clipper (9:16)"
authors = ["Narezki"]
edition = "2021"

[lib]
name = "narezki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
